    <meta name="description" content="FlashGroup — Càng đông, càng rẻ. Nền tảng mua chung theo nhóm và giao nhận thông minh qua Smart Locker." />

  <body class="bg-[#FCFCF7] text-[#000181] antialiased selection:bg-[#D0FFA4] selection:text-[#000181]">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      if ('serviceWorker' in navigator && window.location.protocol.startsWith('http')) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch((err) => {
            console.log('[SW] ServiceWorker registration skipped:', err);
          });
        });
      }
    </script>
